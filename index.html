<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Realtime Student Map</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>

html, body {

  height: 100%;
  margin: 0;
  padding: 0;

}

#map {

  width: 100%;
  height: 100%;

}

.leaflet-popup-content {

  font-size: 16px;

}

.mapButton {

  display: inline-block;

  margin-top: 10px;

  padding: 8px 12px;

  background: #4285F4;

  color: white;

  text-decoration: none;

  border-radius: 5px;

  font-size: 15px;

}

</style>

</head>

<body>

<div id="map"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>

// ===== INITIAL MAP =====
const map = L.map('map').setView(
  [17.4194356, 104.7665447],
  15
);

// ===== MAP TILE =====
L.tileLayer(
  'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
  {
    attribution: '© OpenStreetMap'
  }
).addTo(map);

// ===== STORE MARKERS =====
let markers = [];

// ===== LOAD GPS DATA =====
async function loadLocations() {

  try {

    const response =
      await fetch(

        "https://script.google.com/macros/s/AKfycbyYdG6IHOoqxygbTBdnFUEnK0wFKa8Uv9ZCo2wHze6z3-AWQVacwPT07jSpNyITCkNF/exec"

      );

    const data =
      await response.json();

    // ===== REMOVE OLD MARKERS =====
    markers.forEach(marker => {

      map.removeLayer(marker);

    });

    markers = [];

    // ===== ADD NEW MARKERS =====
    data.forEach(item => {

      if(
        item.latitude &&
        item.longitude
      ) {

        const marker = L.marker([

          Number(item.latitude),

          Number(item.longitude)

        ])

        .addTo(map)

        .bindPopup(

          "<b>" + item.name + "</b><br><br>" +

          "Latitude: " + item.latitude +

          "<br>" +

          "Longitude: " + item.longitude +

          "<br><br>" +

          "<a class='mapButton' target='_blank' href='https://www.google.com/maps/dir/?api=1&destination=" +

          item.latitude + "," +

          item.longitude +

          "'>" +

          "📍 เปิดนำทาง Google Maps" +

          "</a>"

        );

        markers.push(marker);

      }

    });

  }

  catch(error) {

    console.log(error);

  }

}

// ===== FIRST LOAD =====
loadLocations();

// ===== AUTO REFRESH EVERY 5 SEC =====
setInterval(loadLocations, 5000);

</script>

</body>

</html>
